name: sloppy-tron

x-ros-dev: &ros-dev
  working_dir: /workspace
  volumes:
    - .:/workspace
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    UV_PROJECT_ENVIRONMENT: /tmp/sloppy-tron-venv
    UV_LINK_MODE: copy

services:
  reachy-e2e:
    working_dir: /workspace
    image: sloppy-tron-reachy-e2e:dev
    build:
      context: .
      dockerfile: docker/reachy-e2e.Dockerfile
      args:
        REACHY_MINI_SPEC: ${REACHY_MINI_SPEC:-reachy_mini[mujoco]==1.7.1}
    volumes:
      - .:/workspace
      - ${SLOPPY_REPO:-../sloppy}:/opt/sloppy
      - uv-cache-reachy:/root/.cache/uv
      - bun-cache-reachy:/root/.bun/install/cache
      - sloppy-node-modules-reachy:/opt/sloppy/node_modules
    environment:
      MUJOCO_GL: ${MUJOCO_GL:-osmesa}
      PYOPENGL_PLATFORM: ${PYOPENGL_PLATFORM:-osmesa}
      REACHY_PORT: ${REACHY_PORT:-8001}
      SLOPPY_REPO: /opt/sloppy
      UV_PROJECT_ENVIRONMENT: /tmp/sloppy-tron-venv
      UV_LINK_MODE: copy
    ports:
      - "${REACHY_PORT:-8001}:${REACHY_PORT:-8001}"

  ros-jazzy:
    <<: *ros-dev
    image: sloppy-tron-ros-jazzy:dev
    build:
      context: .
      dockerfile: docker/ros-dev.Dockerfile
      args:
        ROS_DISTRO: jazzy
        ROS_IMAGE: ros:jazzy-ros-base-noble
    volumes:
      - .:/workspace
      - uv-cache-jazzy:/root/.cache/uv
      - ros-jazzy-build:/workspace/ros/build
      - ros-jazzy-install:/workspace/ros/install
      - ros-jazzy-log:/workspace/ros/log

  ros-humble:
    <<: *ros-dev
    image: sloppy-tron-ros-humble:dev
    build:
      context: .
      dockerfile: docker/ros-dev.Dockerfile
      args:
        ROS_DISTRO: humble
        ROS_IMAGE: ros:humble-ros-base-jammy
    volumes:
      - .:/workspace
      - uv-cache-humble:/root/.cache/uv
      - ros-humble-build:/workspace/ros/build
      - ros-humble-install:/workspace/ros/install
      - ros-humble-log:/workspace/ros/log

volumes:
  uv-cache-reachy:
  bun-cache-reachy:
  sloppy-node-modules-reachy:
  uv-cache-jazzy:
  uv-cache-humble:
  ros-jazzy-build:
  ros-jazzy-install:
  ros-jazzy-log:
  ros-humble-build:
  ros-humble-install:
  ros-humble-log:
