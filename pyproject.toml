[project]
name = "sloppy-tron"
version = "0.0.0"
description = "Local robot body provider for Sloppy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "slop-ai>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pytest>=9.0.1",
  "ruff>=0.14.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sloppy_tron"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/sloppy_tron/provider", "src/sloppy_tron/ros_bridge"]

[[tool.mypy.overrides]]
module = ["slop_ai", "slop_ai.*"]
ignore_missing_imports = true
